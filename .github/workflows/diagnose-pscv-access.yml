name: Diagnose PSCV Access routing

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-pscv-access.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_ID: e8cee5957315e28c1b4e4b2410c5fbcc
    steps:
      - name: Inspect Access organization and apps
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "=== ORGANIZATION ==="
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/access/organizations" "${auth[@]}" \
            | jq '{success, result: (.result | {name, auth_domain, auto_redirect_to_identity, is_ui_read_only, session_duration})}'
          echo "=== ACCESS APPS ==="
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/access/apps" "${auth[@]}" \
            | jq '{success, result: [.result[] | {id,name,domain,type,aud,auto_redirect_to_identity,app_launcher_visible,session_duration,custom_deny_url,custom_deny_message}]}'
