name: Configure PSCV Microsoft account selection

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/configure-access-account-selection.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: e8cee5957315e28c1b4e4b2410c5fbcc
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCESS_IDP_ID: 89bb4c2b-c2f0-4f59-964a-78242c89c174
    steps:
      - name: Set Microsoft prompt to select_account
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/access/identity_providers/${ACCESS_IDP_ID}"

          current="$(curl --fail-with-body --silent --show-error             --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             "$base")"

          jq -e '.success == true and .result.type == "azureAD"' <<<"$current" >/dev/null

          if [ "$(jq -r '.result.config.prompt // empty' <<<"$current")" != "select_account" ]; then
            body="$(jq '{
              name: .result.name,
              type: .result.type,
              config: ((.result.config // {}) | del(.client_secret) | .prompt = "select_account")
            }' <<<"$current")"

            updated="$(curl --fail-with-body --silent --show-error               --request PUT               --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"               --header "Content-Type: application/json"               --data "$body"               "$base")"

            jq -e '.success == true and .result.config.prompt == "select_account"' <<<"$updated" >/dev/null
          fi

          verified="$(curl --fail-with-body --silent --show-error             --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             "$base")"
          jq -e '.success == true and .result.config.prompt == "select_account"' <<<"$verified" >/dev/null
          echo "Microsoft account selection is enabled for PSCV Room."
