name: Prepare Next 16 compatibility lockfile

on:
  push:
    branches:
      - fix/cloudflare-next16-build

# Dedicated remediation branch only: no Cloudflare credentials, D1 migrations or deployment.
permissions:
  contents: write

concurrency:
  group: next16-lockfile-fix
  cancel-in-progress: true

jobs:
  upgrade-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Upgrade Next.js, OpenNext and aligned dependencies
        run: |
          npm install next@^16 react@^19.2 react-dom@^19.2 @opennextjs/cloudflare@latest --save
          npm install eslint-config-next@^16 --save-dev
      - name: Persist the reproducible package-lock.json
        shell: bash
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(build): lock supported Next 16 and OpenNext dependencies"
            git push origin HEAD:fix/cloudflare-next16-build
          fi
      - name: Verify install from committed lockfile
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Unit and integrity tests
        run: npm test
      - name: Cloudflare OpenNext production build (no deploy)
        run: npm run cf:build
