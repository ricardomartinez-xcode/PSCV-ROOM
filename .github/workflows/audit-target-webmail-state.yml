name: Audit Target Webmail State

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-target-webmail-state.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: e8cee5957315e28c1b4e4b2410c5fbcc
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DB_ID: 13bd8e47-7462-4c1f-841b-25e293afeefd
      BUCKET: serverless-webmail-messages
    steps:
      - name: Audit target D1 R2 domain and routing
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          echo "=== D1 COUNTS ==="
          sql="SELECT
            (SELECT COUNT(*) FROM messages) AS messages,
            (SELECT COUNT(*) FROM attachments) AS attachments,
            (SELECT COUNT(*) FROM users) AS users,
            (SELECT COUNT(*) FROM mailboxes) AS mailboxes,
            (SELECT COUNT(*) FROM mailbox_members) AS mailbox_members,
            (SELECT COUNT(*) FROM sessions) AS sessions,
            (SELECT COUNT(*) FROM recovery_tokens) AS recovery_tokens,
            (SELECT COUNT(*) FROM audit_logs) AS audit_logs,
            (SELECT COUNT(*) FROM login_attempts) AS login_attempts,
            (SELECT COUNT(*) FROM mailbox_provisioning) AS mailbox_provisioning,
            (SELECT COUNT(*) FROM admin_operations) AS admin_operations,
            (SELECT COUNT(*) FROM mailbox_aliases) AS mailbox_aliases,
            (SELECT COUNT(*) FROM d1_migrations) AS migrations;"
          payload="$(jq -n --arg sql "$sql" '{sql:$sql}')"
          curl -fsS "${auth[@]}" -X POST "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" --data "$payload"             | jq '{success,errors,counts:.result[0].results[0]}'

          echo "=== R2 SUMMARY ==="
          : > /tmp/manifest.tsv
          cursor=""
          while :; do
            url="${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${BUCKET}/objects?per_page=1000"
            if [ -n "$cursor" ]; then url="$url&cursor=$(printf '%s' "$cursor" | jq -sRr @uri)"; fi
            page="$(curl -fsS "${auth[@]}" "$url")"
            echo "$page" | jq -r '(.result // [])[] | [.key, (.size // 0), (.etag // "")] | @tsv' >> /tmp/manifest.tsv
            truncated="$(echo "$page" | jq -r '.result_info.is_truncated // false')"
            cursor="$(echo "$page" | jq -r '.result_info.cursor // empty')"
            [ "$truncated" = "true" ] && [ -n "$cursor" ] || break
          done
          LC_ALL=C sort -o /tmp/manifest.tsv /tmp/manifest.tsv
          count="$(wc -l < /tmp/manifest.tsv | tr -d ' ')"
          bytes="$(awk -F '\t' '{s+=$2} END{printf "%.0f",s+0}' /tmp/manifest.tsv)"
          digest="$(sha256sum /tmp/manifest.tsv | awk '{print $1}')"
          jq -n --argjson count "$count" --argjson bytes "$bytes" --arg digest "$digest"             '{bucket:"serverless-webmail-messages",object_count:$count,total_bytes:$bytes,manifest_sha256:$digest}'

          echo "=== CUSTOM DOMAINS ==="
          curl -fsS "${auth[@]}" "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains"             | jq '{success,errors,domains:[(.result // [])[] | select(.service=="webmail-relnets") | {id,hostname,service,environment,zone_id,zone_name}]}'

          echo "=== EMAIL ROUTING ==="
          zone=6e5e9950faabc1c8421d74dc0172bad0
          curl -fsS "${auth[@]}" "${api}/zones/${zone}/email/routing/rules?per_page=100"             | jq '{success,errors,rules:[(.result // [])[] | {id,name,enabled,actions,matchers}]}'
