name: Cut Over Webmail RelNets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cutover-webmail-relnets.yml"

permissions:
  contents: read

jobs:
  cutover:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: e8cee5957315e28c1b4e4b2410c5fbcc
      CLOUDFLARE_ZONE_ID: 6e5e9950faabc1c8421d74dc0172bad0
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER: webmail-relnets
      HOSTNAME: mail.relnets.com
    steps:
      - name: Attach domain and cut Email Routing to Worker
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          echo "=== REPLACE LEGACY DNS WITH WORKER CUSTOM DOMAIN ==="
          existing="$(curl -fsS "${auth[@]}"             "${api}/zones/${CLOUDFLARE_ZONE_ID}/dns_records?name=${HOSTNAME}&per_page=100")"
          echo "$existing" | jq '{records:[(.result // [])[] | {id,type,name,content,proxied,ttl}]}'
          echo "$existing" > /tmp/mail-relnets-dns-backup.json

          while IFS= read -r id; do
            [ -n "$id" ] || continue
            delete="$(curl -fsS "${auth[@]}" -X DELETE               "${api}/zones/${CLOUDFLARE_ZONE_ID}/dns_records/${id}")"
            echo "$delete" | jq '{success,errors}'
            echo "$delete" | jq -e '.success == true' >/dev/null
          done < <(echo "$existing" | jq -r '.result[]? | select(.type=="A" or .type=="AAAA" or .type=="CNAME") | .id')

          payload="$(jq -n             --arg hostname "$HOSTNAME"             --arg service "$WORKER"             --arg zone_id "$CLOUDFLARE_ZONE_ID"             '{hostname:$hostname,service:$service,zone_id:$zone_id,zone_name:"relnets.com"}')"
          domain="$(curl -sS "${auth[@]}" -X PUT             "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains"             --data "$payload")"
          echo "$domain" | jq '{success,errors,result:(.result|if . then {id,hostname,service,environment,zone_id,zone_name} else null end)}'

          if ! echo "$domain" | jq -e '.success == true' >/dev/null; then
            echo "Custom domain attach failed; restoring previous DNS records."
            while IFS= read -r row; do
              body="$(echo "$row" | jq '{type,name,content,ttl,proxied}')"
              curl -sS "${auth[@]}" -X POST                 "${api}/zones/${CLOUDFLARE_ZONE_ID}/dns_records"                 --data "$body"                 | jq '{success,errors,result:(.result|if . then {id,type,name,content,proxied} else null end)}'
            done < <(jq -c '.result[]? | select(.type=="A" or .type=="AAAA" or .type=="CNAME")' /tmp/mail-relnets-dns-backup.json)
            exit 43
          fi

          echo "=== UPDATE RELNETS LITERAL RULES ==="
          rules="$(curl -fsS "${auth[@]}"             "${api}/zones/${CLOUDFLARE_ZONE_ID}/email/routing/rules?per_page=100")"
          echo "$rules" | jq -e '.success == true' >/dev/null

          while IFS= read -r row; do
            id="$(echo "$row" | jq -r '.id')"
            matcher="$(echo "$row" | jq -c '.matchers')"
            name="$(echo "$row" | jq -r '.name // ""')"
            body="$(jq -n               --arg name "$name"               --arg worker "$WORKER"               --argjson matchers "$matcher"               '{name:$name,enabled:true,matchers:$matchers,actions:[{type:"worker",value:[$worker]}],source:"api"}')"
            response="$(curl -fsS "${auth[@]}" -X PUT               "${api}/zones/${CLOUDFLARE_ZONE_ID}/email/routing/rules/${id}"               --data "$body")"
            echo "$response" | jq '{success,errors,result:(.result|{id,name,enabled,actions,matchers,source})}'
            echo "$response" | jq -e '.success == true' >/dev/null
          done < <(echo "$rules" | jq -c '.result[] | select(any(.matchers[]?; .type=="literal" and .field=="to" and (.value|endswith("@relnets.com"))))')

          echo "=== UPDATE CATCH ALL ==="
          catch_body="$(jq -n --arg worker "$WORKER"             '{name:"RelNets Webmail catch-all",enabled:true,matchers:[{type:"all"}],actions:[{type:"worker",value:[$worker]}],source:"api"}')"
          catch_response="$(curl -fsS "${auth[@]}" -X PUT             "${api}/zones/${CLOUDFLARE_ZONE_ID}/email/routing/rules/catch_all"             --data "$catch_body")"
          echo "$catch_response" | jq '{success,errors,result:(.result|{id,name,enabled,actions,matchers,source})}'
          echo "$catch_response" | jq -e '.success == true' >/dev/null

          echo "=== VERIFY DOMAIN AND ROUTING ==="
          domains="$(curl -fsS "${auth[@]}" "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains")"
          echo "$domains" | jq '{domains:[(.result // [])[] | select(.hostname=="mail.relnets.com") | {id,hostname,service,zone_id,zone_name}]}'
          echo "$domains" | jq -e --arg worker "$WORKER"             'any(.result[]?; .hostname=="mail.relnets.com" and .service==$worker)' >/dev/null

          final_rules="$(curl -fsS "${auth[@]}"             "${api}/zones/${CLOUDFLARE_ZONE_ID}/email/routing/rules?per_page=100")"
          echo "$final_rules" | jq '{rules:[(.result // [])[] | {id,name,enabled,actions,matchers,source}]}'
          echo "$final_rules" | jq -e --arg worker "$WORKER"             'any(.result[]?; (.matchers|any(.type=="all")) and .enabled==true and (.actions|any(.type=="worker" and .value[0]==$worker)))' >/dev/null
