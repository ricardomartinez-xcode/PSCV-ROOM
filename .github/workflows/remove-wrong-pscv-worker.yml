name: Remove wrong PSCV Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-wrong-pscv-worker.yml"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRONG_ACCOUNT_ID: 41ffa6a1a7c184fd4308f87780a62cc4
      WORKER_NAME: pscv-room
    steps:
      - name: Verify cleanup target
        shell: bash
        run: |
          set -euo pipefail
          test "$WRONG_ACCOUNT_ID" = "41ffa6a1a7c184fd4308f87780a62cc4"
          test "$WORKER_NAME" = "pscv-room"
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Delete only wrong-account Worker
        shell: bash
        run: |
          set -euo pipefail
          response_file="/tmp/delete-worker.json"
          http_code="$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \
            --request DELETE \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$WRONG_ACCOUNT_ID/workers/scripts/$WORKER_NAME")"
          cat "$response_file"
          if [ "$http_code" = "404" ]; then
            echo "Worker already absent from wrong account."
            exit 0
          fi
          test "$http_code" -ge 200
          test "$http_code" -lt 300
          jq -e '.success == true' "$response_file" >/dev/null

      - name: Verify wrong Worker is absent
        shell: bash
        run: |
          set -euo pipefail
          http_code="$(curl --silent --show-error --output /tmp/check-worker.txt --write-out "%{http_code}" \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$WRONG_ACCOUNT_ID/workers/scripts/$WORKER_NAME")"
          if [ "$http_code" = "404" ]; then
            echo "Confirmed: wrong-account Worker is absent."
            exit 0
          fi
          cat /tmp/check-worker.txt
          echo "::error::Wrong-account Worker still exists (HTTP $http_code)."
          exit 1
