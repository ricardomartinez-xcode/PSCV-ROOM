name: Provision Webmail D1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/provision-webmail-d1.yml"

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: e8cee5957315e28c1b4e4b2410c5fbcc
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Ensure serverless-webmail D1 exists
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          list="$(curl -fsS "${auth[@]}" "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=100")"
          uuid="$(echo "$list" | jq -r '.result[] | select(.name=="serverless-webmail") | .uuid' | head -n1)"
          if [ -z "$uuid" ]; then
            created="$(curl -fsS "${auth[@]}" -X POST "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" --data '{"name":"serverless-webmail"}')"
            echo "$created" | jq '{success, database:(.result|{uuid,name,version})}'
          else
            jq -n --arg uuid "$uuid" '{success:true,database:{uuid:$uuid,name:"serverless-webmail"},existing:true}'
          fi
