name: PSCV tasks events migration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pscv-tasks-events-migration.yml"
      - "scripts/migrate-tasks-events.mjs"

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Migrate and verify tasks/events
        run: node scripts/migrate-tasks-events.mjs
