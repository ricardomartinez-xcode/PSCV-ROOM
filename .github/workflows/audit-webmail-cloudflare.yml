name: Audit Webmail Cloudflare Target

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-webmail-cloudflare.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: e8cee5957315e28c1b4e4b2410c5fbcc
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Audit target account resources
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          echo "=== ACCOUNT TOKEN ACCESS ==="
          curl -fsS "${auth[@]}" "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}"             | jq '{success, account: (.result | {id,name})}'

          echo "=== WORKER SERVICES ==="
          curl -fsS "${auth[@]}" "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/services"             | jq '{success, services: [.result[] | {id,default_environment,created_on,modified_on}]}'

          echo "=== D1 DATABASES ==="
          curl -fsS "${auth[@]}" "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=100"             | jq '{success, databases: [.result[] | {uuid,name,version}]}'

          echo "=== R2 BUCKETS ==="
          r2="$(curl -sS "${auth[@]}" "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets")"
          echo "$r2" | jq '{success, buckets: [(.result.buckets // .result // [])[] | {name,creation_date,location}]}'

          echo "=== RELNETS ZONE + EMAIL ROUTING ==="
          zones="$(curl -fsS "${auth[@]}" "${api}/zones?account.id=${CLOUDFLARE_ACCOUNT_ID}&name=relnets.com")"
          echo "$zones" | jq '{success, zones: [.result[] | {id,name,status}]}'
          zone_id="$(echo "$zones" | jq -r '.result[0].id // empty')"
          if [ -n "$zone_id" ]; then
            settings="$(curl -sS "${auth[@]}" "${api}/zones/${zone_id}/email/routing")"
            echo "$settings" | jq '{email_routing: {success, result}}'
            rules="$(curl -sS "${auth[@]}" "${api}/zones/${zone_id}/email/routing/rules?per_page=100")"
            echo "$rules" | jq '{rules_success: .success, rules: [(.result // [])[] | {id,name,enabled,actions,matchers}]}'
          fi
