name: Audit PSCV Cloudflare Build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-pscv-cloudflare-build.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: e8cee5957315e28c1b4e4b2410c5fbcc
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Inspect PSCV Workers Builds
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          env_json="$(curl -fsS "${auth[@]}" "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/services/pscv-room/environments/production")"
          tag="$(echo "$env_json" | jq -r '.result.script.tag // empty')"
          test -n "$tag"
          echo "WORKER_TAG=$tag"

          builds="$(curl -fsS "${auth[@]}" "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/builds/workers/${tag}/builds?per_page=10")"
          echo "$builds" | jq '{success,errors,builds:[(.result // [])[] | {build_uuid,build_outcome,created_on,modified_on,build_trigger_metadata}]}'

          latest="$(echo "$builds" | jq -r '.result[0].build_uuid // empty')"
          test -n "$latest"
          echo "LATEST_BUILD=$latest"

          curl -fsS "${auth[@]}" "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/builds/builds/${latest}/logs"             | jq '{success,errors,result}'
