name: Reusable Webmail Deploy

on:
  workflow_call:
    inputs:
      apply_migrations:
        description: Apply pending D1 migrations before deployment
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: e8cee5957315e28c1b4e4b2410c5fbcc
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate project
        run: npm run check
      - name: Verify target Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler whoami
      - name: Apply target D1 migrations
        if: ${{ inputs.apply_migrations }}
        run: npm run db:remote
      - name: Deploy webmail-relnets
        run: npm run deploy -- --keep-vars
