name: Cloudflare Workers

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: cloudflare-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test deployment configuration
        run: npm test
      - name: Build OpenNext Worker
        run: npm run cf:build

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: 41ffa6a1a7c184fd4308f87780a62cc4
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify Cloudflare credential
        shell: bash
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN in the production GitHub environment."
            exit 1
          fi
      - name: Verify VAPID private key
        shell: bash
        run: |
          npx wrangler secret list --config wrangler.jsonc > /tmp/worker-secrets.txt
          if ! grep -q "VAPID_PRIVATE_KEY" /tmp/worker-secrets.txt; then
            echo "::error::Missing VAPID_PRIVATE_KEY in the pscv-room Cloudflare Worker."
            exit 1
          fi
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply pscv-room --remote --config wrangler.jsonc
      - name: Deploy Worker and static Next assets
        run: npm run cf:deploy -- --keep-vars

  report:
    if: always() && github.event_name != 'pull_request'
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Publish final deployment status
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        shell: bash
        run: |
          state="success"
          description="Cloudflare deployment completed"
          if [ "$VALIDATE_RESULT" != "success" ]; then
            state="failure"
            description="Validation failed before deployment"
          elif [ "$DEPLOY_RESULT" != "success" ]; then
            state="failure"
            description="Cloudflare deployment failed"
          fi

          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(jq -n \
            --arg state "$state" \
            --arg context "cloudflare/deployment" \
            --arg description "$description" \
            --arg target_url "$target_url" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload"
