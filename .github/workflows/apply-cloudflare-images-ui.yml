name: Apply Cloudflare Images UI patch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cloudflare-images-media
          fetch-depth: 0
      - name: Apply validated UI patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/ui.patch
          git apply --check /tmp/ui.patch
          git apply /tmp/ui.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/admin-hub.tsx components/app-shell-v5.tsx
          git commit -m 'feat: connect Cloudflare Images to task and notice forms'
          git push origin HEAD:feature/cloudflare-images-media
