name: Configure Webmail Migration Build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/configure-webmail-migration-build.yml"

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: e8cee5957315e28c1b4e4b2410c5fbcc
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WORKER_TAG: d24c0733ae2f4defb79a882dc7354072
    steps:
      - name: Point production build at migration-aware deploy script
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          triggers="$(curl -fsS "${auth[@]}" "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/builds/workers/${WORKER_TAG}/triggers")"
          trigger_uuid="$(echo "$triggers" | jq -r '.result[] | select((.branch_includes // []) | index("main")) | .trigger_uuid' | head -n1)"
          test -n "$trigger_uuid"
          curl -fsS "${auth[@]}" -X PATCH "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/builds/triggers/${trigger_uuid}" \
            --data '{"deploy_command":"bash scripts/cloudflare-deploy.sh"}' \
            | jq '{success,errors,result:{trigger_uuid:.result.trigger_uuid,deploy_command:.result.deploy_command,branch_includes:.result.branch_includes}}'
