name: R2 semantic migration one-shot

on:
  push:
    branches: [fix/material-bucket-organization-20260907-v2]
    paths:
      - '.github/workflows/r2-semantic-migrate-oneshot.yml'

permissions:
  actions: read
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    env:
      CLOUDFLARE_ACCOUNT_ID: 41ffa6a1a7c184fd4308f87780a62cc4
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download validated semantic audit plan
        run: |
          mkdir -p outputs
          gh run download 34267957256 -n r2-semantic-audit-34267957256 -D outputs
          test -s outputs/r2-semantic-migration-plan.json
      - name: Validate migration runner
        run: node --check scripts/r2-semantic-migrate-safe.mjs
      - name: Apply verified semantic migration
        env:
          MIGRATION_CONFIRM: MIGRATE_SAFE
          DELETE_SOURCE_DUPLICATES: DELETE_EXACT_DUPLICATES
        run: node scripts/r2-semantic-migrate-safe.mjs
      - name: Upload migration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-semantic-migration-applied-${{ github.run_id }}
          path: outputs/r2-semantic-migration-applied.json
          if-no-files-found: error
          retention-days: 30
