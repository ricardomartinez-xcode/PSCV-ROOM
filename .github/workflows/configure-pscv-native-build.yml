name: Configure PSCV Native Build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/configure-pscv-native-build.yml"

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: e8cee5957315e28c1b4e4b2410c5fbcc
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Align Workers Builds with PSCV pipeline
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          env_json="$(curl -fsS "${auth[@]}" "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/services/pscv-room/environments/production")"
          tag="$(echo "$env_json" | jq -r '.result.script.tag // empty')"
          test -n "$tag"

          triggers="$(curl -fsS "${auth[@]}" "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/builds/workers/${tag}/triggers")"
          trigger_uuid="$(echo "$triggers" | jq -r '.result[] | select((.branch_includes // []) | index("main")) | .trigger_uuid' | head -n1)"
          test -n "$trigger_uuid"

          payload="$(jq -n '{
            build_command:"npm run lint && npm run typecheck && npm test && npm run cf:build",
            deploy_command:"echo \"Validated by Cloudflare Workers Builds; deployment is handled by GitHub Actions\"",
            root_directory:"/"
          }')"

          response="$(curl -fsS "${auth[@]}" -X PATCH             "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/builds/triggers/${trigger_uuid}"             --data "$payload")"

          echo "$response" | jq '{
            success,
            errors,
            result:{
              trigger_uuid:.result.trigger_uuid,
              build_command:.result.build_command,
              deploy_command:.result.deploy_command,
              root_directory:.result.root_directory,
              branch_includes:.result.branch_includes
            }
          }'
          echo "$response" | jq -e '.success == true' >/dev/null
