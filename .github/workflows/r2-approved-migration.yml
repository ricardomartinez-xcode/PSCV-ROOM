name: Approved R2 hierarchy migration

on:
  workflow_dispatch:
    inputs:
      example_input:
        description: Type MIGRATE to copy, verify and update D1 without deleting originals
        required: true
        default: DRY_RUN

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 350
    env:
      CLOUDFLARE_ACCOUNT_ID: 41ffa6a1a7c184fd4308f87780a62cc4
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MIGRATION_CONFIRM: ${{ inputs.example_input }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Cloudflare credential
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler whoami >/dev/null
      - name: Enable noninteractive R2 uploads
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/r2-migrate-approved.mjs")
          source = path.read_text()
          marker = 'runWrangler(["r2", "object", "put",'
          start = source.find(marker)
          if start < 0:
              raise SystemExit("R2 put call was not found")
          old = '"--remote"]);'
          position = source.find(old, start)
          if position < 0:
              raise SystemExit("R2 put remote flag was not found")
          replacement = '"--remote", "--force"]);'
          source = source[:position] + replacement + source[position + len(old):]
          path.write_text(source)
          PY
      - name: Copy, verify and remap R2 materials
        run: node scripts/r2-migrate-approved.mjs
      - name: Publish latest report snapshot
        if: always()
        shell: bash
        run: |
          test -f r2-migration-report.json || exit 0
          content="$(base64 -w0 r2-migration-report.json)"
          current_sha="$(gh api repos/${GITHUB_REPOSITORY}/contents/outputs/r2-migration-report-latest.json --jq .sha 2>/dev/null || true)"
          args=(-X PUT "repos/${GITHUB_REPOSITORY}/contents/outputs/r2-migration-report-latest.json" -f message="chore: publish R2 migration report [skip ci]" -f content="$content" -f branch="${GITHUB_REF_NAME}")
          if [ -n "$current_sha" ]; then args+=(-f sha="$current_sha"); fi
          gh api "${args[@]}" >/dev/null
      - name: Upload migration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-migration-report-${{ github.run_id }}
          path: r2-migration-report.json
          if-no-files-found: warn
          retention-days: 30
