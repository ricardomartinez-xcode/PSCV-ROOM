name: Inspect PSCV Access application

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-pscv-access-domain.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ACCOUNT_ID: e8cee5957315e28c1b4e4b2410c5fbcc
      APP_ID: 5ea707e5-bd98-4ccd-b514-938c14c76ecc
    steps:
      - name: Read Access application
        shell: bash
        run: |
          set -euo pipefail
          curl -sS \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/access/apps/$APP_ID" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | jq .
