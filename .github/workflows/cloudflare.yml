name: Cloudflare Workers

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: cloudflare-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  announce:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Publish pending deployment status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(jq -n \
            --arg state "pending" \
            --arg context "cloudflare/deployment" \
            --arg description "Cloudflare deployment is running" \
            --arg target_url "$target_url" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload"

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test deployment configuration
        run: npm test
      - name: Build OpenNext Worker
        run: npm run cf:build

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: 41ffa6a1a7c184fd4308f87780a62cc4
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify Cloudflare credential
        shell: bash
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN in the production GitHub environment."
            exit 1
          fi
      - name: Ensure persistent VAPID credentials
        id: vapid
        shell: bash
        run: |
          set -euo pipefail
          secrets_file="/tmp/worker-secrets.json"
          npx wrangler secret list --config wrangler.jsonc > "$secrets_file"

          has_private="$(jq -r 'map(.name) | index("VAPID_PRIVATE_KEY") != null' "$secrets_file")"
          has_public="$(jq -r 'map(.name) | index("VAPID_PUBLIC_KEY") != null' "$secrets_file")"

          rotate="false"
          if [ -f .github/rotate-vapid-once ] || [ "$has_private" != "true" ] || [ "$has_public" != "true" ]; then
            rotate="true"
            node scripts/generate-vapid-keys.mjs /tmp/vapid-private.key /tmp/vapid-public.key
            npx wrangler secret put VAPID_PRIVATE_KEY --config wrangler.jsonc < /tmp/vapid-private.key
            npx wrangler secret put VAPID_PUBLIC_KEY --config wrangler.jsonc < /tmp/vapid-public.key
          fi

          echo "rotated=${rotate}" >> "$GITHUB_OUTPUT"

      - name: Verify complete VAPID pair
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --config wrangler.jsonc > /tmp/worker-secrets.json

          jq -e 'map(.name) | index("VAPID_PRIVATE_KEY") != null' /tmp/worker-secrets.json > /dev/null || {
            echo "::error::VAPID_PRIVATE_KEY could not be stored in the pscv-room Worker."
            exit 1
          }

          jq -e 'map(.name) | index("VAPID_PUBLIC_KEY") != null' /tmp/worker-secrets.json > /dev/null || {
            echo "::error::VAPID_PUBLIC_KEY could not be stored in the pscv-room Worker."
            exit 1
          }

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply pscv-room --remote --config wrangler.jsonc
      - name: Deploy Worker and static Next assets
        run: npm run cf:deploy -- --keep-vars
      - name: Remove temporary VAPID files
        if: always()
        shell: bash
        run: rm -f /tmp/vapid-private.key /tmp/vapid-public.key /tmp/worker-secrets.json


  materialize:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'work/pscv-room-consolidation-20260905'
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/pscv-room-consolidation-20260905
          fetch-depth: 0
      - name: Materialize validated consolidation source
        shell: bash
        run: |
          set -euo pipefail
          baseline='9ee53de8e8c3ee2aad7494cc58390109afe45774'
          expected_tree='3c9ca2902af5aeb6a28f8587401c66e0c100e0b3'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$baseline"
          base64 -d .pscv-phase3.patch.gz.b64 | gzip -d > /tmp/pscv-final.patch
          git apply --check /tmp/pscv-final.patch
          git apply /tmp/pscv-final.patch
          git show origin/main:package.json > package.json
          git show origin/main:.github/workflows/cloudflare.yml > .github/workflows/cloudflare.yml
          rm -f .pscv-phase1.patch .pscv-phase2.patch.gz.b64 .pscv-phase3.patch.gz.b64
          git add -A
          git diff --cached --check
          actual_tree="$(git write-tree)"
          if [ "$actual_tree" != "$expected_tree" ]; then
            echo "::error::Materialized tree mismatch: $actual_tree != $expected_tree"
            exit 1
          fi
          git config user.name 'RelNets Builder'
          git config user.email 'builder@relnets.local'
          git commit -m 'feat: materialize PSCV consolidation'
          git push origin HEAD:work/pscv-room-consolidation-20260905

  report:
    if: always() && github.event_name != 'pull_request'
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Publish final deployment status
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        shell: bash
        run: |
          state="success"
          description="Cloudflare deployment completed"
          if [ "$VALIDATE_RESULT" != "success" ]; then
            state="failure"
            description="Validation failed before deployment"
          elif [ "$DEPLOY_RESULT" != "success" ]; then
            state="failure"
            description="Cloudflare deployment failed"
          fi

          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(jq -n \
            --arg state "$state" \
            --arg context "cloudflare/deployment" \
            --arg description "$description" \
            --arg target_url "$target_url" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$payload"
