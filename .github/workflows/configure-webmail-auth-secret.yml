name: Configure Webmail Auth Secret

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/configure-webmail-auth-secret.yml"

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: e8cee5957315e28c1b4e4b2410c5fbcc
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Ensure AUTH_ENCRYPTION_KEY exists
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          existing="$(curl -fsS "${auth[@]}" "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/webmail-relnets/secrets")"
          if echo "$existing" | jq -e '.result[]? | select(.name=="AUTH_ENCRYPTION_KEY")' >/dev/null; then
            echo "AUTH_ENCRYPTION_KEY already exists; leaving it unchanged."
          else
            key="$(openssl rand -base64 48 | tr -d '\n')"
            payload="$(jq -n --arg text "$key" '{name:"AUTH_ENCRYPTION_KEY",text:$text,type:"secret_text"}')"
            response="$(curl -fsS "${auth[@]}" -X PUT "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/webmail-relnets/secrets" --data "$payload")"
            unset key payload
            echo "$response" | jq '{success,errors,result:{name:.result.name,type:.result.type}}'
          fi
          curl -fsS "${auth[@]}" "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/webmail-relnets/secrets"             | jq '{success,secrets:[(.result // [])[] | {name,type}]}'
