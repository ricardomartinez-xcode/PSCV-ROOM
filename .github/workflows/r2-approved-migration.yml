name: Approved R2 hierarchy migration

on:
  workflow_dispatch:
    inputs:
      example_input:
        description: Type MIGRATE to copy, verify and update D1 without deleting originals
        required: true
        default: DRY_RUN

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 350
    env:
      CLOUDFLARE_ACCOUNT_ID: 41ffa6a1a7c184fd4308f87780a62cc4
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MIGRATION_CONFIRM: ${{ inputs.example_input }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare credential
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler whoami >/dev/null

      - name: Start private remote R2 preview
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          cat > wrangler.r2-copy-preview.jsonc <<EOF2
          {
            "name": "pscv-r2-copy-preview",
            "main": "scripts/r2-copy-worker.mjs",
            "compatibility_date": "2026-07-30",
            "r2_buckets": [
              {
                "binding": "R2",
                "bucket_name": "psicologia",
                "remote": true
              }
            ],
            "vars": {
              "MIGRATION_TOKEN": "${token}"
            }
          }
          EOF2
          echo "::add-mask::$token"
          echo "COPY_WORKER_TOKEN=$token" >> "$GITHUB_ENV"
          echo "COPY_WORKER_URL=http://127.0.0.1:8787" >> "$GITHUB_ENV"
          nohup npx wrangler dev --remote             --config wrangler.r2-copy-preview.jsonc             --port 8787             --local-protocol http             > wrangler-r2-preview.log 2>&1 &
          echo $! > wrangler-r2-preview.pid

          ready=0
          for _ in $(seq 1 60); do
            if curl -sS --max-time 3 -o /dev/null http://127.0.0.1:8787/; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat wrangler-r2-preview.log
            exit 1
          fi

      - name: Copy, verify and remap R2 materials
        run: node scripts/r2-migrate-approved.mjs

      - name: Stop private R2 preview
        if: always()
        shell: bash
        run: |
          if [ -f wrangler-r2-preview.pid ]; then
            kill "$(cat wrangler-r2-preview.pid)" 2>/dev/null || true
          fi

      - name: Publish latest migration summary
        if: always()
        shell: bash
        run: |
          test -f r2-migration-report.json || exit 0
          jq '{
            mode,
            startedAt,
            finishedAt,
            copied: (.copied | length),
            reused: (.reused | length),
            failures,
            databaseVerification
          }' r2-migration-report.json > r2-migration-summary.json
          content="$(base64 -w0 r2-migration-summary.json)"
          path="outputs/r2-migration-summary-latest.json"
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}" --jq .sha 2>/dev/null || true)"
          args=(-X PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" -f message="chore: publish R2 migration summary [skip ci]" -f content="$content" -f branch="${GITHUB_REF_NAME}")
          if [ -n "$current_sha" ]; then args+=(-f sha="$current_sha"); fi
          gh api "${args[@]}" >/dev/null

      - name: Upload migration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-migration-report-${{ github.run_id }}
          path: |
            r2-migration-report.json
            wrangler-r2-preview.log
          if-no-files-found: warn
          retention-days: 30
