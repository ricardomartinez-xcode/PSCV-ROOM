name: Configure Cloudflare Images runtime

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  configure:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: 41ffa6a1a7c184fd4308f87780a62cc4
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Verify Cloudflare Images permission
        id: images
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          raw="$(curl --silent --show-error --write-out $'\n%{http_code}' --request POST --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --form 'requireSignedURLs=false' "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/images/v2/direct_upload")"
          http_status="${raw##*$'\n'}"
          body="${raw%$'\n'*}"
          jq -n --arg status "$http_status" --argjson payload "$body" '{http_status:$status,success:($payload.success // false),errors:($payload.errors // []),messages:($payload.messages // [])}' > /tmp/cloudflare-images-status.json
          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ] || [ "$(jq -r '.success // false' <<<"$body")" != "true" ]; then
            exit 1
          fi
          image_id="$(jq -r '.result.id // empty' <<<"$body")"
          test -n "$image_id"
          curl --fail-with-body --silent --show-error --request DELETE --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/images/v1/${image_id}" >/dev/null
      - name: Configure Worker secrets
        if: steps.images.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | npx wrangler secret put CLOUDFLARE_ACCOUNT_ID --config wrangler.jsonc
          printf '%s' "$CLOUDFLARE_API_TOKEN" | npx wrangler secret put CLOUDFLARE_IMAGES_API_TOKEN --config wrangler.jsonc
          npx wrangler secret list --config wrangler.jsonc > /tmp/worker-secrets.json
          jq -e 'map(.name) | index("CLOUDFLARE_ACCOUNT_ID") != null' /tmp/worker-secrets.json >/dev/null
          jq -e 'map(.name) | index("CLOUDFLARE_IMAGES_API_TOKEN") != null' /tmp/worker-secrets.json >/dev/null
      - name: Publish sanitized diagnostic
        if: always()
        shell: bash
        run: |
          test -f /tmp/cloudflare-images-status.json || echo '{"success":false,"errors":[{"message":"No diagnostic response was produced."}]}' > /tmp/cloudflare-images-status.json
          content="$(base64 -w0 /tmp/cloudflare-images-status.json)"
          path="outputs/cloudflare-images-config-status.json"
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}" --jq .sha 2>/dev/null || true)"
          args=(-X PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" -f message="chore: publish Cloudflare Images configuration status [skip ci]" -f content="$content" -f branch="${GITHUB_REF_NAME}")
          if [ -n "$current_sha" ]; then args*+=(-f sha="$current_sha"); fi
          gh api "${args[@]}" >/dev/null
