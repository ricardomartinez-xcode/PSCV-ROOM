name: Approved R2 hierarchy migration

on:
  workflow_dispatch:
    inputs:
      example_input:
        description: Type DRY_RUN, MIGRATE, or ORGANIZE. ORGANIZE verifies, remaps D1, and removes legacy duplicates
        required: true
        default: DRY_RUN

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 350
    env:
      CLOUDFLARE_ACCOUNT_ID: 41ffa6a1a7c184fd4308f87780a62cc4
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MIGRATION_CONFIRM: ${{ inputs.example_input }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize approved bucket organization
        shell: bash
        run: |
          set -euo pipefail
          baseline="f8088f91875c966f632e65ca492a07587bbaaff7"
          expected_tree="a000d74c3003a1be5aa9eacfc9277022f7a2e4e8"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$baseline"
          git show origin/main:.github/workflows/r2-approved-migration.yml > .github/workflows/r2-approved-migration.yml
          base64 -d .pscv-material-bucket.patch.gz.b64 | gzip -d > /tmp/pscv-material-bucket.patch
          git apply --check /tmp/pscv-material-bucket.patch
          git apply /tmp/pscv-material-bucket.patch
          rm -f .pscv-material-bucket.patch.gz.b64
          git add -A
          git diff --cached --check
          actual_tree="$(git write-tree)"
          test "$actual_tree" = "$expected_tree"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate application contracts
        run: |
          npm test
          npm run typecheck

      - name: Verify Cloudflare credential
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler whoami >/dev/null

      - name: Start private remote R2 preview
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          cat > wrangler.r2-copy-preview.jsonc <<EOF2
          {
            "name": "pscv-r2-copy-preview",
            "main": "scripts/r2-copy-worker.mjs",
            "compatibility_date": "2026-07-30",
            "r2_buckets": [
              {
                "binding": "R2",
                "bucket_name": "psicologia",
                "remote": true
              }
            ],
            "vars": {
              "MIGRATION_TOKEN": "${token}"
            }
          }
          EOF2
          echo "::add-mask::$token"
          echo "COPY_WORKER_TOKEN=$token" >> "$GITHUB_ENV"
          echo "COPY_WORKER_URL=http://127.0.0.1:8787" >> "$GITHUB_ENV"
          nohup npx wrangler dev --remote --config wrangler.r2-copy-preview.jsonc --port 8787 --local-protocol http > wrangler-r2-preview.log 2>&1 &
          echo $! > wrangler-r2-preview.pid

          ready=0
          for _ in $(seq 1 60); do
            if curl -sS --max-time 3 -o /dev/null http://127.0.0.1:8787/; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat wrangler-r2-preview.log
            exit 1
          fi

      - name: Make D1 batch compatible
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/r2-migrate-approved.mjs")
          source = path.read_text()
          source = source.replace('const statements = ["BEGIN TRANSACTION;"];', 'const statements = [];')
          source = source.replace('  statements.push("COMMIT;");\n', '')
          path.write_text(source)
          PY
          node --check scripts/r2-migrate-approved.mjs

      - name: Copy, verify and remap R2 materials
        run: node scripts/r2-migrate-approved.mjs

      - name: Stop private R2 preview
        if: always()
        shell: bash
        run: |
          if [ -f wrangler-r2-preview.pid ]; then
            kill "$(cat wrangler-r2-preview.pid)" 2>/dev/null || true
          fi

      - name: Publish clean organization branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'RelNets Builder'
          git config user.email 'builder@relnets.local'
          git commit -m 'feat: organize R2 materials hierarchy'
          git push origin HEAD:refs/heads/fix/material-bucket-organization-20260907-v2

      - name: Upload migration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-migration-report-${{ github.run_id }}
          path: |
            r2-migration-report.json
            wrangler-r2-preview.log
          if-no-files-found: warn
          retention-days: 30
