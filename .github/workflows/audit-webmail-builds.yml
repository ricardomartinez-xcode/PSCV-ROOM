name: Audit Webmail Workers Builds

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-webmail-builds.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: e8cee5957315e28c1b4e4b2410c5fbcc
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Audit Worker and GitHub Builds integration
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          echo "=== WORKER ENV ==="
          curl -sS "${auth[@]}" "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/services/webmail-relnets/environments/production"             | jq '{success,errors,result:(.result|{script,environment,dispatch_namespace,outbound,script_tag,etag})}'
          echo "=== WORKER SETTINGS ==="
          curl -sS "${auth[@]}" "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/webmail-relnets/settings" \
            | jq '{success,errors,bindings:[(.result.bindings // [])[] | if .type=="secret_text" then {name,type} else . end],compatibility_date:.result.compatibility_date,compatibility_flags:.result.compatibility_flags}'
          echo "=== WORKER SECRET NAMES ==="
          curl -sS "${auth[@]}" "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/webmail-relnets/secrets" \
            | jq '{success,errors,secrets:[(.result // [])[] | {name,type}]}'
          echo "=== WORKER BUILDS ==="
          curl -sS "${auth[@]}" "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/builds/workers/d24c0733ae2f4defb79a882dc7354072/builds?per_page=10" \
            | jq '{success,errors,builds:[(.result // [])[] | {build_uuid,build_outcome,created_on,modified_on,build_trigger_metadata}]}'
          echo "=== LATEST BUILD LOGS ==="
          curl -sS "${auth[@]}" "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/builds/builds/4a6b3e1b-0f5e-4b03-85a8-b181e6d15886/logs" \
            | jq '{success,errors,result}'
          echo "=== REPO AUTOFILL ==="
          curl -sS "${auth[@]}" "${api}/accounts/${CLOUDFLARE_ACCOUNT_ID}/builds/repos/github/257445968/1296352696/config_autofill"             | jq '{success,errors,result}'
