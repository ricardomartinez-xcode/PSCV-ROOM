name: Approved R2 hierarchy migration

on:
  workflow_dispatch:
    inputs:
      example_input:
        description: Type MIGRATE to copy, verify and update D1 without deleting originals
        required: true
        default: DRY_RUN

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 350
    env:
      CLOUDFLARE_ACCOUNT_ID: 41ffa6a1a7c184fd4308f87780a62cc4
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MIGRATION_CONFIRM: ${{ inputs.example_input }}
      GH_TOKEN: ${{ github.token }}
      TEMP_WORKER_NAME: pscv-r2-copy-temp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare credential
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler whoami >/dev/null

      - name: Deploy temporary protected R2 copy worker
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          cat > wrangler.r2-copy-temp.jsonc <<EOF
          {
            "name": "${TEMP_WORKER_NAME}",
            "main": "scripts/r2-copy-worker.mjs",
            "compatibility_date": "2026-07-30",
            "workers_dev": true,
            "r2_buckets": [
              {
                "binding": "R2",
                "bucket_name": "psicologia"
              }
            ],
            "vars": {
              "MIGRATION_TOKEN": "${token}"
            }
          }
          EOF
          npx wrangler deploy --config wrangler.r2-copy-temp.jsonc
          subdomain="$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | jq -r '.result.subdomain')"
          test -n "$subdomain"
          test "$subdomain" != "null"
          url="https://${TEMP_WORKER_NAME}.${subdomain}.workers.dev"
          echo "::add-mask::$token"
          echo "COPY_WORKER_TOKEN=$token" >> "$GITHUB_ENV"
          echo "COPY_WORKER_URL=$url" >> "$GITHUB_ENV"

      - name: Copy, verify and remap R2 materials
        run: node scripts/r2-migrate-approved.mjs

      - name: Remove temporary R2 copy worker
        if: always()
        run: npx wrangler delete --name "$TEMP_WORKER_NAME" --force || true

      - name: Publish latest report snapshot
        if: always()
        shell: bash
        run: |
          test -f r2-migration-report.json || exit 0
          content="$(base64 -w0 r2-migration-report.json)"
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/outputs/r2-migration-report-latest.json" --jq .sha 2>/dev/null || true)"
          args=(-X PUT "repos/${GITHUB_REPOSITORY}/contents/outputs/r2-migration-report-latest.json" -f message="chore: publish R2 migration report [skip ci]" -f content="$content" -f branch="${GITHUB_REF_NAME}")
          if [ -n "$current_sha" ]; then args+=(-f sha="$current_sha"); fi
          gh api "${args[@]}" >/dev/null

      - name: Upload migration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-migration-report-${{ github.run_id }}
          path: r2-migration-report.json
          if-no-files-found: warn
          retention-days: 30
