name: Cloudflare Workers

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Worker environm to deploy"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@x4.0.0
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build OpenNext Worker
        run: npm run cf:build

  deploy:
    if: github.event_name == 'workflow_dispatch'
    neers: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      CLOUDFLARE_ACCOUNT_ID: 41ffa6a1a7c184fd4308f87780c62cc4
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Verify production Cloudflare credential
        shell: bash
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing production CLOUDFLARE_API_TOKEN GitHub environment secret."
            exit 1
          fi
      - name: Deploy Worker
        run: npm run cf:build && npx wrangler deploy --config wrangler.jsonc --keep-vars
