name: Approved R2 hierarchy migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type MIGRATE to copy, verify and update D1 without deleting originals
        required: true
        default: DRY_RUN

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 350
    env:
      CLOUDFLARE_ACCOUNT_ID: 41ffa6a1a7c184fd4308f87780a62cc4
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MIGRATION_CONFIRM: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Cloudflare credential
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler whoami >/dev/null
      - name: Copy, verify and remap R2 materials
        run: node scripts/r2-migrate-approved.mjs
      - name: Upload migration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-migration-report-${{ github.run_id }}
          path: r2-migration-report.json
          if-no-files-found: warn
          retention-days: 30
